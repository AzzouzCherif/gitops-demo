apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: company-local-tls
  namespace: frontend-prod
spec:
  secretName: company-local-tls-secret
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    name: company-ca-issuer
    kind: ClusterIssuer
  commonName: "company.local"
  dnsNames:
    - "company.local"

