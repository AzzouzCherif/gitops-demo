apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: company-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/AzzouzCherif/gitops-demo.git'
    targetRevision: main
    path: apps/root
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

